<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <defs>
    <linearGradient id="rwasj-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="rwasj-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="rwasj-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
  </defs>

  <!-- Circular Emblem Badge -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
    
    <!-- Outer Decorative Sunburst / Seed Ring -->
    <circle cx="40" cy="40" r="33" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    
    <!-- Central Empowered Woman Figure holding scales & sprout -->
    <!-- Head with headwrap / crown -->
    <circle cx="40" cy="23" r="6" fill="url(#rwasj-green)" />
    <path d="M35 20 C37 16 43 16 45 20 C42 18 38 18 35 20 Z" fill="url(#rwasj-gold)" />
    
    <!-- Nurturing/Solidarity Arms cradling upward -->
    <path d="M26 38 C28 32 34 30 40 30 C46 30 52 32 54 38 C50 44 46 45 40 45 C34 45 30 44 26 38 Z" fill="url(#rwasj-green)" />
    
    <!-- Sprout / Foliage of Sustainability -->
    <path d="M40 44 L40 62" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <path d="M40 54 C33 50 31 43 33 39 C38 41 39 46 40 50 Z" fill="url(#rwasj-green)" />
    <path d="M40 50 C41 46 42 41 47 39 C49 43 47 50 40 54 Z" fill="url(#rwasj-gold)" />
    
    <!-- Scales of Justice Base -->
    <path d="M26 62 C32 65 48 65 54 62" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography Layout -->
  <g transform="translate(102, 18)">
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#047857">RWASJ</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" letter-spacing="1.6" fill="#1F2937">RURAL WOMEN'S ACTION</text>
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" letter-spacing="1.2" fill="#D97706">FOR SUSTAINABILITY &amp; JUSTICE</text>
    <text x="0" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="1.8" fill="#6B7280">CAMEROON • ADVOCACY &amp; EQUALITY</text>
  </g>
</svg>
